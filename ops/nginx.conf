server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'" always;
    location = /_health { access_log off; return 200 'ok'; }
    location ~ (^|/)\. { return 404; }
    location ~* \.(php[0-9]?|phtml|phar|log|ini|conf|sql|bak|backup|old|orig|save|swp|dist|sh|env)$ { return 404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
    location / { try_files $uri $uri/ =404; }
}
